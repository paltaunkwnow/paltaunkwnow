<svg fill="none" viewBox="0 0 800 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          border-radius: 16px;
          padding: 24px;
          box-sizing: border-box;
          color: #ffffff;
          position: relative;
          overflow: hidden;
          border: 1px solid rgba(56, 189, 248, 0.3);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(56, 189, 248, 0.1);
        }

        /* Star particles animation */
        .stars {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          background-image: 
            radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 150px 80px, #38bdf8, rgba(0,0,0,0)),
            radial-gradient(1px 1px at 300px 180px, #ffffff, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 450px 40px, #c084fc, rgba(0,0,0,0)),
            radial-gradient(1px 1px at 600px 220px, #ffffff, rgba(0,0,0,0)),
            radial-gradient(2px 2px at 720px 110px, #38bdf8, rgba(0,0,0,0));
          animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
          0% { opacity: 0.3; transform: scale(0.98); }
          100% { opacity: 1; transform: scale(1.02); }
        }

        /* Outer animated glow ring */
        .card-glow {
          position: absolute;
          top: -50%;
          left: -50%;
          width: 200%;
          height: 200%;
          background: conic-gradient(from 0deg at 50% 50%, rgba(56, 189, 248, 0.15) 0deg, rgba(168, 85, 247, 0.15) 180deg, rgba(56, 189, 248, 0.15) 360deg);
          animation: rotateGlow 12s linear infinite;
          pointer-events: none;
        }

        @keyframes rotateGlow {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        .inner-box {
          position: relative;
          z-index: 1;
          background: rgba(15, 23, 42, 0.75);
          backdrop-filter: blur(12px);
          border-radius: 12px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          padding: 24px;
          display: flex;
          align-items: center;
          gap: 24px;
        }

        .avatar-wrap {
          position: relative;
          width: 100px;
          height: 100px;
          flex-shrink: 0;
        }

        .avatar-border {
          position: absolute;
          inset: -4px;
          border-radius: 50%;
          background: linear-gradient(45deg, #00d2ff, #a855f7, #3b82f6);
          animation: pulseBorder 3s infinite alternate;
        }

        @keyframes pulseBorder {
          0% { filter: drop-shadow(0 0 4px #00d2ff); }
          100% { filter: drop-shadow(0 0 12px #a855f7); }
        }

        .avatar-img {
          position: relative;
          width: 100px;
          height: 100px;
          border-radius: 50%;
          background: #0f172a;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
        }

        .user-info {
          flex-grow: 1;
        }

        .username {
          font-size: 14px;
          color: #38bdf8;
          font-weight: 600;
          letter-spacing: 1px;
          margin-bottom: 2px;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .display-name {
          font-size: 32px;
          font-weight: 800;
          background: linear-gradient(90deg, #ffffff 0%, #e2e8f0 50%, #38bdf8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin: 0;
          line-height: 1.2;
        }

        .tagline {
          font-size: 14px;
          color: #94a3b8;
          margin-top: 4px;
          margin-bottom: 16px;
          font-weight: 400;
        }

        .pills {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }

        .pill {
          background: rgba(30, 41, 59, 0.8);
          border: 1px solid rgba(56, 189, 248, 0.3);
          border-radius: 20px;
          padding: 4px 14px;
          font-size: 12px;
          font-weight: 600;
          color: #e2e8f0;
          transition: all 0.3s ease;
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }

        .pill-sec {
          border-color: rgba(168, 85, 247, 0.4);
          color: #c084fc;
        }

        .pill-next {
          border-color: rgba(255, 255, 255, 0.3);
          color: #ffffff;
        }

        .pill-ts {
          border-color: rgba(49, 120, 198, 0.5);
          color: #60a5fa;
        }

        .stats-badge {
          text-align: right;
          border-left: 1px solid rgba(255, 255, 255, 0.1);
          padding-left: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-width: 90px;
        }

        .stat-value {
          font-size: 28px;
          font-weight: 900;
          color: #38bdf8;
          line-height: 1;
        }

        .stat-label {
          font-size: 10px;
          color: #64748b;
          text-transform: uppercase;
          letter-spacing: 1.5px;
          margin-top: 6px;
        }
      </style>

      <div class="container">
        <div class="stars"></div>
        <div class="card-glow"></div>
        <div class="inner-box">
          <div class="avatar-wrap">
            <div class="avatar-border"></div>
            <div class="avatar-img">
              <!-- Duck Avatar Vector -->
              <svg width="70" height="70" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Duck Head & Body -->
                <circle cx="50" cy="55" r="32" fill="#FACC15"/>
                <!-- Hat / Cowboy vibe -->
                <path d="M20 36 C25 20, 75 20, 80 36 Z" fill="#475569"/>
                <rect x="15" y="34" width="70" height="6" rx="3" fill="#334155"/>
                <rect x="30" y="30" width="40" height="4" fill="#E11D48"/>
                <!-- Eyes / Sunglasses -->
                <rect x="32" y="46" width="16" height="12" rx="3" fill="#0F172A"/>
                <rect x="52" y="46" width="16" height="12" rx="3" fill="#0F172A"/>
                <line x1="48" y1="50" x2="52" y2="50" stroke="#0F172A" stroke-width="2"/>
                <!-- Beak -->
                <path d="M40 62 C40 58, 60 58, 60 62 C60 70, 40 70, 40 62 Z" fill="#F97316"/>
              </svg>
            </div>
          </div>

          <div class="user-info">
            <div class="username">@paltaunkwnow</div>
            <h1 class="display-name">PatoDev</h1>
            <div class="tagline">Next.js &amp; TypeScript Developer | Cybersecurity Learner</div>
            <div class="pills">
              <span class="pill pill-ts">TypeScript</span>
              <span class="pill pill-next">Next.js</span>
              <span class="pill">Python</span>
              <span class="pill">JavaScript</span>
              <span class="pill pill-sec">CyberSecurity</span>
            </div>
          </div>

          <div class="stats-badge">
            <div class="stat-value">PRO</div>
            <div class="stat-label">PROFILE</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
