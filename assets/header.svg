<svg width="800" height="280" viewBox="0 0 800 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes glowBorder {
      0% { stroke: #00d2ff; filter: drop-shadow(0 0 6px #00d2ff); }
      50% { stroke: #a855f7; filter: drop-shadow(0 0 14px #a855f7); }
      100% { stroke: #00d2ff; filter: drop-shadow(0 0 6px #00d2ff); }
    }
    @keyframes smoke1 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      40% { opacity: 0.7; }
      100% { transform: translate(-18px, -45px) scale(1.6); opacity: 0; }
    }
    @keyframes smoke2 {
      0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translate(-10px, -50px) scale(1.8); opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .card-border { animation: glowBorder 4s infinite alternate; }
    .smoke-puff-1 { animation: smoke1 2.8s infinite linear; }
    .smoke-puff-2 { animation: smoke2 3.4s infinite linear 1.2s; }
    .star-1 { animation: twinkle 3s infinite ease-in-out; }
    .star-2 { animation: twinkle 2.2s infinite ease-in-out 1s; }
  </style>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Avatar Glow Gradient -->
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Avatar Clip Circle -->
    <clipPath id="avatarClip">
      <circle cx="105" cy="140" r="54"/>
    </clipPath>
  </defs>

  <!-- Outer Main Card -->
  <rect x="4" y="4" width="792" height="272" rx="20" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" class="card-border"/>

  <!-- Inner Glass Box -->
  <rect x="24" y="24" width="752" height="232" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Star Field -->
  <circle cx="60" cy="50" r="1.5" fill="#ffffff" class="star-1"/>
  <circle cx="720" cy="65" r="2" fill="#38bdf8" class="star-2"/>
  <circle cx="680" cy="225" r="1.5" fill="#c084fc" class="star-1"/>
  <circle cx="140" cy="235" r="2" fill="#ffffff" class="star-2"/>
  <circle cx="450" cy="45" r="1.5" fill="#38bdf8" class="star-1"/>

  <!-- Avatar Glowing Ring -->
  <circle cx="105" cy="140" r="58" fill="none" stroke="url(#avatarGlow)" stroke-width="4"/>

  <!-- User's Actual Avatar Image (Duck Smoking with Cowboy Hat) -->
  <image href="https://github.com/paltaunkwnow.png" x="51" y="86" width="108" height="108" clip-path="url(#avatarClip)"/>

  <!-- Animated Smoke Effect coming out of cigarette -->
  <g transform="translate(142, 125)">
    <circle class="smoke-puff-1" cx="0" cy="0" r="5" fill="#e2e8f0" opacity="0"/>
    <circle class="smoke-puff-2" cx="3" cy="-4" r="7" fill="#cbd5e1" opacity="0"/>
    <circle class="smoke-puff-1" cx="-2" cy="-8" r="9" fill="#94a3b8" opacity="0"/>
  </g>

  <!-- Profile Text Info -->
  <text x="185" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="1">@paltaunkwnow</text>

  <text x="185" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff">PatoDev</text>

  <text x="185" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Next.js &amp; TypeScript Web Developer | CyberSecurity Learner</text>

  <!-- Skill Badges (Pure SVG) -->
  <!-- TypeScript -->
  <g transform="translate(185, 172)">
    <rect x="0" y="0" width="105" height="28" rx="14" fill="#1e293b" stroke="#3178c6" stroke-width="1.5"/>
    <text x="52" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Next.js -->
  <g transform="translate(300, 172)">
    <rect x="0" y="0" width="85" height="28" rx="14" fill="#1e293b" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="42" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Next.js</text>
  </g>

  <!-- CyberSecurity -->
  <g transform="translate(395, 172)">
    <rect x="0" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="62" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">CyberSecurity</text>
  </g>

  <!-- Python -->
  <g transform="translate(530, 172)">
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#1e293b" stroke="#3776ab" stroke-width="1.5"/>
    <text x="40" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Python</text>
  </g>

  <!-- Right Divider & Status -->
  <g transform="translate(660, 75)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#334155" stroke-width="1"/>
    <text x="45" y="55" font-family="sans-serif" font-size="24" font-weight="900" fill="#38bdf8" text-anchor="middle">PRO</text>
    <text x="45" y="75" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.5">PROFILE</text>
  </g>
</svg>
