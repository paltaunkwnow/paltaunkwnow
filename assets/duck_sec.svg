<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes matrixFall {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(220px); opacity: 0; }
    }
    @keyframes borderGlow {
      0%, 100% { stroke: #10b981; filter: drop-shadow(0 0 8px #10b981); }
      50% { stroke: #06b6d4; filter: drop-shadow(0 0 14px #06b6d4); }
    }
    @keyframes smokePuff {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translate(-15px, -35px) scale(1.5); opacity: 0; }
    }
    .m-col-1 { animation: matrixFall 4s infinite linear; }
    .m-col-2 { animation: matrixFall 3.2s infinite linear 1.2s; }
    .m-col-3 { animation: matrixFall 4.5s infinite linear 2s; }
    .card-border-cyber { animation: borderGlow 4s infinite alternate; }
    .smoke-anim { animation: smokePuff 3s infinite linear; }
  </style>

  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#091428" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <clipPath id="duckSecClip">
      <circle cx="90" cy="100" r="45"/>
    </clipPath>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="792" height="192" rx="16" fill="url(#cyberBg)" stroke="#10b981" stroke-width="2" class="card-border-cyber"/>

  <!-- Matrix Code Stream Background -->
  <g fill="#10b981" font-family="monospace" font-size="12" opacity="0.4">
    <text x="180" y="0" class="m-col-1">01101 OSINT 10101</text>
    <text x="320" y="0" class="m-col-2">MALTEGO SHODAN 01</text>
    <text x="480" y="0" class="m-col-3">RECON-NG BURP 10</text>
    <text x="640" y="0" class="m-col-1">METASPLOIT NMAP 01</text>
  </g>

  <!-- Inner Content Box -->
  <rect x="20" y="20" width="760" height="160" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Duck Avatar Circle with Glow -->
  <circle cx="90" cy="100" r="49" fill="none" stroke="#10b981" stroke-width="3"/>
  <image href="https://avatars.githubusercontent.com/u/paltaunkwnow" x="45" y="55" width="90" height="90" clip-path="url(#duckSecClip)"/>

  <!-- Animated Cyber Smoke -->
  <g transform="translate(122, 90)">
    <circle class="smoke-anim" cx="0" cy="0" r="4" fill="#6ee7b7" opacity="0"/>
    <circle class="smoke-anim" cx="2" cy="-4" r="6" fill="#34d399" opacity="0"/>
  </g>

  <!-- Section Header -->
  <text x="160" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#10b981" letter-spacing="1.5">OSINT &amp; CYBER INTELLIGENCE UNIT</text>
  <text x="160" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Investigación OSINT &amp; Análisis de Vulnerabilidades</text>

  <!-- Badges in SVG -->
  <!-- OSINT -->
  <g transform="translate(160, 108)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="67" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">OSINT Investigator</text>
  </g>

  <!-- Maltego -->
  <g transform="translate(303, 108)">
    <rect x="0" y="0" width="85" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="42" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Maltego</text>
  </g>

  <!-- Shodan -->
  <g transform="translate(396, 108)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="40" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#fda4af" text-anchor="middle">Shodan</text>
  </g>

  <!-- Recon-ng -->
  <g transform="translate(484, 108)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="45" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">Recon-ng</text>
  </g>

  <!-- Row 2 Badges -->
  <!-- Burp Suite -->
  <g transform="translate(160, 140)">
    <rect x="0" y="0" width="95" height="24" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1"/>
    <text x="47" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">Burp Suite</text>
  </g>

  <!-- Metasploit -->
  <g transform="translate(263, 140)">
    <rect x="0" y="0" width="95" height="24" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="47" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Metasploit</text>
  </g>

  <!-- Nmap -->
  <g transform="translate(366, 140)">
    <rect x="0" y="0" width="70" height="24" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="35" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Nmap</text>
  </g>

  <!-- Social Engineering -->
  <g transform="translate(444, 140)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#1e293b" stroke="#e11d48" stroke-width="1"/>
    <text x="70" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#fb7185" text-anchor="middle">Social Engineering</text>
  </g>
</svg>
